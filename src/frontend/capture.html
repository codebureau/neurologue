<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Capture</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --neuro-blue:   #1C2A3A;
      --cortex-teal:  #2AA6A1;
      --insight-cyan: #5FD4E6;
      --ink:          #0E0E0F;
      --slate:        #3A3A3C;
      --fog:          #D4D4D8;
      --cloud:        #F5F5F7;
      --white:        #FFFFFF;
      --error-red:    #D9534F;
      --radius:       6px;
      --font:         'Inter', system-ui, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      -webkit-app-region: drag;
      user-select: none;
    }

    .popup {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--white);
      border: 1px solid var(--fog);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    /* ── Title bar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 6px;
      background: var(--neuro-blue);
      color: var(--white);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .titlebar__label { opacity: 0.85; }
    .titlebar__hint  { opacity: 0.45; font-size: 11px; }

    /* ── Toolbar ── */
    .toolbar {
      display: none;
      align-items: center;
      gap: 2px;
      padding: 4px 10px;
      background: var(--cloud);
      border-bottom: 1px solid var(--fog);
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .toolbar.visible { display: flex; }

    .toolbar__btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      color: var(--slate);
      transition: background 0.1s, color 0.1s;
      padding: 0;
    }

    .toolbar__btn:hover { background: var(--fog); color: var(--ink); }
    .toolbar__btn.active { background: var(--cortex-teal); color: var(--white); }

    .toolbar__sep {
      width: 1px;
      height: 16px;
      background: var(--fog);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .toolbar__spacer { flex: 1; }

    .toolbar__toggle {
      font-size: 11px;
      color: var(--slate);
      background: transparent;
      border: 1px solid var(--fog);
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      font-family: var(--font);
      transition: border-color 0.1s, color 0.1s;
    }

    .toolbar__toggle:hover { border-color: var(--cortex-teal); color: var(--ink); }
    .toolbar__toggle.active { border-color: var(--cortex-teal); color: var(--cortex-teal); }

    /* ── Body ── */
    .body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 8px;
      -webkit-app-region: no-drag;
      user-select: text;
      overflow: hidden;
    }

    textarea, input {
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      background: var(--cloud);
      border: 1px solid var(--fog);
      border-radius: var(--radius);
      outline: none;
      resize: none;
      width: 100%;
      transition: border-color 0.15s;
    }

    textarea:focus, input:focus { border-color: var(--cortex-teal); }

    #content {
      flex: 1;
      padding: 8px 10px;
      line-height: 1.5;
      min-height: 0;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    #content.plain-font {
      font-family: var(--font);
    }

    #tags {
      height: 32px;
      padding: 0 10px;
      font-size: 13px;
    }

    #tags::placeholder, #content::placeholder { color: var(--slate); opacity: 0.55; }

    /* ── Preview ── */
    #preview {
      display: none;
      flex: 1;
      padding: 8px 10px;
      line-height: 1.6;
      overflow-y: auto;
      background: var(--cloud);
      border: 1px solid var(--fog);
      border-radius: var(--radius);
      min-height: 0;
      font-size: 14px;
      color: var(--ink);
    }

    #preview.visible { display: block; }

    #preview h1, #preview h2, #preview h3 {
      margin-bottom: 4px;
      margin-top: 8px;
      color: var(--neuro-blue);
    }
    #preview h1 { font-size: 18px; }
    #preview h2 { font-size: 16px; }
    #preview h3 { font-size: 14px; }
    #preview p  { margin-bottom: 6px; }
    #preview ul, #preview ol { padding-left: 18px; margin-bottom: 6px; }
    #preview li { margin-bottom: 2px; }
    #preview code {
      background: var(--fog);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
    }
    #preview pre {
      background: var(--fog);
      border-radius: var(--radius);
      padding: 8px 10px;
      overflow-x: auto;
      margin-bottom: 6px;
    }
    #preview pre code { background: none; padding: 0; }
    #preview blockquote {
      border-left: 3px solid var(--cortex-teal);
      padding-left: 10px;
      color: var(--slate);
      margin-bottom: 6px;
    }
    #preview a { color: var(--cortex-teal); }
    #preview strong { font-weight: 600; }
    #preview em { font-style: italic; }
    #preview hr { border: none; border-top: 1px solid var(--fog); margin: 8px 0; }

    /* ── Mode toggle row ── */
    .mode-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .md-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--slate);
      cursor: pointer;
    }

    .md-toggle input[type="checkbox"] { cursor: pointer; accent-color: var(--cortex-teal); }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 10px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .footer__left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer__hint { font-size: 11px; color: var(--slate); opacity: 0.55; }

    .btn-paste-plain {
      font-size: 11px;
      color: var(--slate);
      background: transparent;
      border: 1px solid var(--fog);
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      font-family: var(--font);
      transition: border-color 0.1s, color 0.1s;
    }

    .btn-paste-plain:hover { border-color: var(--cortex-teal); color: var(--ink); }
    .btn-paste-plain.active { border-color: var(--cortex-teal); color: var(--cortex-teal); background: rgba(42,166,161,0.08); }

    .btn-save {
      padding: 6px 20px;
      background: var(--cortex-teal);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-save:hover    { background: var(--insight-cyan); }
    .btn-save:disabled { opacity: 0.45; cursor: default; }

    /* ── Tag suggestions ── */
    #tag-suggestions {
      display: none;
      flex-wrap: wrap;
      gap: 5px;
      padding: 0 2px;
      -webkit-app-region: no-drag;
    }
    #tag-suggestions.visible { display: flex; }
    .tag-suggestion {
      font-size: 11px;
      background: transparent;
      border: 1px solid var(--cortex-teal);
      color: var(--cortex-teal);
      border-radius: 4px;
      padding: 1px 8px;
      cursor: pointer;
      font-family: var(--font);
      transition: background 0.1s, color 0.1s;
      user-select: none;
    }
    .tag-suggestion:hover { background: var(--cortex-teal); color: var(--white); }
    .tag-suggestions-label {
      font-size: 11px;
      color: var(--slate);
      opacity: 0.6;
      align-self: center;
    }

    /* ── Error banner ── */
    .error {
      display: none;
      font-size: 12px;
      color: var(--error-red);
      padding: 0 12px 6px;
    }

    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="popup">
    <div class="titlebar">
      <span class="titlebar__label">Neurologue — Capture</span>
      <span class="titlebar__hint">Esc to cancel</span>
    </div>

    <!-- Markdown formatting toolbar (shown when MD mode is active) -->
    <div class="toolbar" id="toolbar">
      <button class="toolbar__btn" id="tb-bold"   title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="toolbar__btn" id="tb-italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="toolbar__btn" id="tb-code"   title="Inline code">`</button>
      <div class="toolbar__sep"></div>
      <button class="toolbar__btn" id="tb-ul"     title="Bullet list">• ≡</button>
      <button class="toolbar__btn" id="tb-quote"  title="Blockquote">"</button>
      <button class="toolbar__btn" id="tb-link"   title="Link">🔗</button>
      <div class="toolbar__spacer"></div>
      <button class="toolbar__toggle" id="tb-preview">Preview</button>
    </div>

    <div class="body">
      <textarea
        id="content"
        placeholder="What are you thinking?"
        spellcheck="true"
        autofocus
      ></textarea>
      <div id="preview" aria-label="Markdown preview"></div>
      <input
        id="tags"
        type="text"
        placeholder="Tags (comma-separated, optional)"
        spellcheck="false"
        autocomplete="off"
      />
      <div id="tag-suggestions" role="list" aria-label="Suggested tags"></div>
    </div>

    <p class="error" id="error-msg"></p>

    <div class="footer">
      <div class="footer__left">
        <span class="footer__hint">Ctrl+Enter to save</span>
        <label class="md-toggle" title="Enable Markdown formatting">
          <input type="checkbox" id="md-toggle" />
          Markdown
        </label>
        <button class="btn-paste-plain" id="btn-paste-plain" title="Paste without formatting">Paste plain</button>
      </div>
      <button class="btn-save" id="btn-save" disabled>Save</button>
    </div>
  </div>

  <script src="capture.js"></script>
</body>
</html>
